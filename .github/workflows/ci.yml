name: Validar y exportar Nuestra IA
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_PAGES: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: nuestra-ia-pages
          path: dist-pages/
